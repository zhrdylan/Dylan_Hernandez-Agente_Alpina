[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alpina-rag-agent"
version = "0.1.0"
description = "Agente RAG de Alpina: respuestas trazables sobre documentos oficiales."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-groq>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "groq>=0.37",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pdfplumber>=0.11",
    "pypdfium2>=5.14",
    "pillow>=13.0",
    "winocr>=0.0.9; sys_platform == 'win32'",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "boto3>=1.35",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
